name: Build ZeniX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZeniX.apk
          echo "{\"versionCode\": $((GITHUB_RUN_NUMBER + 100)), \"versionName\": \"2.$GITHUB_RUN_NUMBER\"}" > version.json
          cat version.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeniX-apk
          path: ZeniX.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ZeniX (latest build)
          body: "Download ZeniX.apk below on your phone and tap it to install."
          make_latest: true
          files: |
            ZeniX.apk
            version.json
